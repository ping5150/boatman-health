<!DOCTYPE html><html class="light" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Boatman Health - PSQI Survey Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work_Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f7f9fc",
                        "outline": "#737780",
                        "on-secondary-container": "#004077",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#1f477b",
                        "surface": "#f7f9fc",
                        "surface-container": "#eceef1",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#35485e",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#d5e3ff",
                        "on-secondary-fixed-variant": "#004884",
                        "inverse-primary": "#a7c8ff",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary": "#0a2033",
                        "on-primary-fixed": "#001b3c",
                        "primary": "#001e40",
                        "surface-container-high": "#e6e8eb",
                        "surface-container-low": "#f2f4f7",
                        "primary-container": "#003366",
                        "background": "#f7f9fc",
                        "secondary-fixed-dim": "#a4c9ff",
                        "primary-fixed-dim": "#a7c8ff",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#075fab",
                        "on-tertiary-container": "#8a9eb6",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#071d30",
                        "on-surface-variant": "#43474f",
                        "on-secondary-fixed": "#001c39",
                        "outline-variant": "#c3c6d1",
                        "surface-variant": "#e0e3e6",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#b4c8e2",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#d4e3ff",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e0e3e6",
                        "secondary-container": "#70aeff",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "surface-tint": "#3a5f94",
                        "on-primary-container": "#799dd6",
                        "tertiary-container": "#21354a",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#d0e4ff",
                        "surface-dim": "#d8dadd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Work Sans"],
                        "label": ["Work Sans"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Work Sans', sans-serif; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(10%) sepia(20%) saturate(5000%) hue-rotate(200deg) brightness(95%) contrast(90%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-xl flex flex-col">
<div class="flex items-center px-6 h-16 w-full">
<button class="text-blue-900 dark:text-blue-200 p-2 hover:bg-blue-50/50 transition-colors rounded-full" style="">
<span class="material-symbols-outlined" style="">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-lg tracking-tight text-blue-900 dark:text-blue-200 ml-2" style="">睡眠调研问卷</h1>
</div>
<!-- Progress Bar Overlay -->
<div class="w-full h-1 bg-surface-container">
<div class="h-full bg-secondary transition-all duration-500 ease-out" style="width: 20%;"></div>
</div>
</header>
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Headline Section -->
<section class="mb-12">
<span class="text-secondary font-headline font-extrabold tracking-widest text-sm uppercase" style=""><br></span>
<h2 class="text-primary font-headline font-extrabold text-4xl mt-2 tracking-tight" style="">01基础睡眠模式</h2>
<p class="text-on-surface-variant mt-4 text-lg font-light" style=""><br></p>
</section>
<!-- Survey Form Content -->
<div class="space-y-10">
<!-- Question 1: Bedtime -->
<div class="p-8 bg-surface-container-lowest rounded-full shadow-[0_8px_24px_rgba(0,30,64,0.06)] transition-all">
<label class="block text-primary font-headline font-bold text-lg mb-6 leading-snug" style="">
                    1. 过去一个月通常上床睡觉的时间是？
                </label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-xl p-4 text-primary font-headline font-semibold text-xl focus:ring-2 focus:ring-secondary/20 transition-all cursor-pointer" type="time" value="23:00">
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">
<span class="material-symbols-outlined" style="">schedule</span>
</div>
</div>
</div>
<!-- Question 2: Latency -->
<div class="p-8 bg-surface-container-low rounded-full">
<label class="block text-primary font-headline font-bold text-lg mb-6 leading-snug" style="">
                    2. 过去一个月每晚通常需要多长时间才能入睡？
                </label>
<div class="grid grid-cols-2 gap-4">
<button class="bg-surface-container-lowest text-on-surface-variant p-4 rounded-xl text-center font-medium hover:bg-secondary hover:text-white transition-all focus:ring-2 focus:ring-secondary/40 shadow-sm" style="">&lt;15min</button>
<button class="bg-secondary text-white p-4 rounded-xl text-center font-bold shadow-md ring-2 ring-secondary/20 transition-all" style="">16-30min</button>
<button class="bg-surface-container-lowest text-on-surface-variant p-4 rounded-xl text-center font-medium hover:bg-secondary hover:text-white transition-all focus:ring-2 focus:ring-secondary/40 shadow-sm" style="">31-60min</button>
<button class="bg-surface-container-lowest text-on-surface-variant p-4 rounded-xl text-center font-medium hover:bg-secondary hover:text-white transition-all focus:ring-2 focus:ring-secondary/40 shadow-sm" style="">&gt;60min</button>
</div>
</div>
<!-- Question 3: Wake up time -->
<div class="p-8 bg-surface-container-lowest rounded-full shadow-[0_8px_24px_rgba(0,30,64,0.06)]">
<label class="block text-primary font-headline font-bold text-lg mb-6 leading-snug" style="">
                    3. 过去一个月每天早上通常什么时候起床？
                </label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-xl p-4 text-primary font-headline font-semibold text-xl focus:ring-2 focus:ring-secondary/20 transition-all cursor-pointer" type="time" value="07:30">
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">
<span class="material-symbols-outlined" style="">wb_sunny</span>
</div>
</div>
</div>
<!-- Question 4: Actual sleep duration -->
<div class="p-8 bg-surface-container-low rounded-full">
<label class="block text-primary font-headline font-bold text-lg mb-6 leading-snug" style="">
                    4. 过去一个月每晚实际睡眠时间有多少？
                </label>
<div class="flex items-center space-x-4">
<div class="flex-1 group">
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-xl p-4 text-primary font-headline font-semibold text-xl focus:ring-2 focus:ring-secondary/20 transition-all" max="24" min="0" placeholder="0" type="number">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-medium" style="">小时</span>
</div>
</div>
<div class="flex-1 group">
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-xl p-4 text-primary font-headline font-semibold text-xl focus:ring-2 focus:ring-secondary/20 transition-all" max="59" min="0" placeholder="0" type="number">
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-medium" style="">分钟</span>
</div>
</div>
</div>
<p class="mt-4 text-on-surface-variant text-sm font-light italic flex items-center" style=""></p>
</div>
</div>
</main>
<!-- BottomNavBar (Customised for Survey Flow) -->
<nav class="fixed bottom-0 left-0 w-full px-8 py-8 flex justify-between items-center bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-t-3xl shadow-[0_-8px_24px_rgba(0,30,64,0.06)] z-50">
<!-- Progress Dots -->
<div class="flex space-x-2">
<div class="w-8 h-2.5 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Action Button -->
<button class="flex items-center justify-center bg-blue-900 text-white dark:bg-blue-600 dark:text-white rounded-xl px-8 py-4 font-headline font-bold text-sm tracking-wide shadow-lg hover:opacity-90 active:scale-95 transition-all" style="">
<span class="" style="">下一模块</span>
<span class="material-symbols-outlined ml-2 text-lg" style="">arrow_forward</span>
</button>
</nav>
</body></html>
