<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Boatman Health - Lifestyle Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#f7f9fc",
                    "tertiary": "#0a2033",
                    "surface-container-low": "#f2f4f7",
                    "surface-container-high": "#e6e8eb",
                    "on-secondary-fixed": "#001c39",
                    "inverse-primary": "#a7c8ff",
                    "inverse-surface": "#2d3133",
                    "inverse-on-surface": "#eff1f4",
                    "primary-container": "#003366",
                    "surface-variant": "#e0e3e6",
                    "on-primary-fixed-variant": "#1f477b",
                    "error-container": "#ffdad6",
                    "outline": "#737780",
                    "tertiary-fixed": "#d0e4ff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#8a9eb6",
                    "on-secondary": "#ffffff",
                    "surface": "#f7f9fc",
                    "on-primary-fixed": "#001b3c",
                    "surface-dim": "#d8dadd",
                    "secondary": "#075fab",
                    "primary": "#001e40",
                    "surface-container": "#eceef1",
                    "on-tertiary-fixed": "#071d30",
                    "on-surface-variant": "#43474f",
                    "on-secondary-fixed-variant": "#004884",
                    "on-surface": "#191c1e",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#a7c8ff",
                    "on-secondary-container": "#004077",
                    "on-error-container": "#93000a",
                    "primary-fixed": "#d5e3ff",
                    "secondary-fixed": "#d4e3ff",
                    "secondary-container": "#70aeff",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#a4c9ff",
                    "surface-container-highest": "#e0e3e6",
                    "outline-variant": "#c3c6d1",
                    "tertiary-fixed-dim": "#b4c8e2",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#21354a",
                    "on-primary-container": "#799dd6",
                    "on-background": "#191c1e",
                    "surface-tint": "#3a5f94",
                    "error": "#ba1a1a",
                    "background": "#f7f9fc",
                    "on-tertiary-fixed-variant": "#35485e"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Work Sans"],
                    "label": ["Work Sans"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 8px 24px rgba(0, 30, 64, 0.06);
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased leading-relaxed">
<!-- TopAppBar -->
<nav class="bg-slate-50/80 backdrop-blur-xl docked full-width top-0 sticky z-50 flex flex-col items-center w-full pt-4 pb-2 px-6">
<div class="w-full flex justify-between items-center mb-4">
<span class="material-symbols-outlined text-blue-900 cursor-pointer hover:opacity-80 transition-opacity scale-95 duration-150" style="">arrow_back</span>
<span class="text-lg font-bold text-blue-900 font-headline" style="">船夫健康</span>
<div class="w-6"></div> <!-- Spacer -->
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-500" style="width: 60%"></div>
</div>
<div class="w-full text-center mt-2">
<span class="text-[10px] text-slate-500 font-medium uppercase tracking-widest" style=""><br></span>
</div>
</nav>
<main class="max-w-md mx-auto px-6 pt-8 pb-32 space-y-10">
<!-- Section Header -->
<header class="space-y-2">
<h1 class="text-3xl font-headline font-extrabold text-primary tracking-tight" style="">05 生活方式（1/2）</h1>
<p class="text-on-surface-variant text-sm" style=""><br></p>
</header>
<form class="space-y-8">
<!-- Question 1: Stress Level -->
<div class="space-y-4">
<label class="text-lg font-headline font-bold text-primary block" style="">1. 请评估您当前的压力水平：</label>
<div class="bg-surface-container-low rounded-xl p-2 space-y-1">
<label class="flex p-3 hover:bg-white rounded-lg transition-colors cursor-pointer group items-start" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest focus:ring-secondary mt-0.5" name="stress" type="radio">
<span class="ml-3 text-on-surface font-medium" style="">无：没有感到任何压力</span>
</label>
<label class="flex p-3 hover:bg-white rounded-lg transition-colors cursor-pointer items-start" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest focus:ring-secondary mt-0.5" name="stress" type="radio">
<span class="ml-3 text-on-surface font-medium" style="">轻微：感受到轻微的压力，但对日常活动影响不大</span>
</label>
<label class="flex p-3 hover:bg-white rounded-lg transition-colors cursor-pointer items-start" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest focus:ring-secondary mt-0.5" name="stress" type="radio">
<span class="ml-3 text-on-surface font-medium" style="">一般：偶尔感到压力，能够较好地应对</span>
</label>
<label class="flex p-3 hover:bg-white rounded-lg transition-colors cursor-pointer items-start" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest focus:ring-secondary mt-0.5" name="stress" type="radio">
<span class="ml-3 text-on-surface font-medium" style="">相当大：经常感到压力，对工作和生活有一定影响</span>
</label>
<label class="flex p-3 hover:bg-white rounded-lg transition-colors cursor-pointer items-start" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest focus:ring-secondary mt-0.5" name="stress" type="radio">
<span class="ml-3 text-on-surface font-medium" style="">无法忍受：压力非常大，已经严重影响生活和工作</span>
</label>
</div>
</div>
<!-- Question 2: Smoking -->
<div class="space-y-4">
<label class="text-lg font-headline font-bold text-primary block" style="">2. 您是否吸烟？</label>
<div class="flex gap-4">
<label class="flex-1 bg-surface-container-low p-4 rounded-xl flex items-center justify-center cursor-pointer hover:bg-white transition-colors" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest" name="smoke" type="radio">
<span class="ml-2 font-medium" style="">是</span>
</label>
<label class="flex-1 bg-surface-container-low p-4 rounded-xl flex items-center justify-center cursor-pointer hover:bg-white transition-colors" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest" name="smoke" type="radio">
<span class="ml-2 font-medium" style="">否</span>
</label>
</div>
<div class="bg-surface-container-low p-5 rounded-xl space-y-4 editorial-shadow">
<p class="text-sm font-medium text-on-surface-variant" style="">如果是，每天几支烟？持续多长时间？</p>
<input class="w-full bg-surface-container-highest border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-secondary/20 placeholder:text-outline" placeholder="例如：10支/天，持续5年" type="text">
</div>
</div>
<!-- Question 3: Alcohol -->
<div class="space-y-4">
<label class="text-lg font-headline font-bold text-primary block" style="">3. 您是否饮酒？</label>
<div class="flex gap-4">
<label class="flex-1 bg-surface-container-low p-4 rounded-xl flex items-center justify-center cursor-pointer hover:bg-white transition-colors" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest" name="alcohol" type="radio">
<span class="ml-2 font-medium" style="">是</span>
</label>
<label class="flex-1 bg-surface-container-low p-4 rounded-xl flex items-center justify-center cursor-pointer hover:bg-white transition-colors" style="">
<input class="w-5 h-5 text-secondary border-none bg-surface-container-highest" name="alcohol" type="radio">
<span class="ml-2 font-medium" style="">否</span>
</label>
</div>
<div class="bg-surface-container-low p-5 rounded-xl space-y-4 editorial-shadow">
<p class="text-sm font-medium text-on-surface-variant" style="">如果是，您每周饮酒几次？通常饮用哪种酒类？每次饮用的量是多少？</p>
<input class="w-full bg-surface-container-highest border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-secondary/20 placeholder:text-outline" placeholder="次数、酒类与饮用量详情" type="text">
</div>
</div>
<!-- Question 4: Sleep Schedule -->
<div class="space-y-4">
<label class="text-lg font-headline font-bold text-primary block" style="">4. 您平时工作日：</label>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-4 rounded-xl space-y-2">
<span class="text-xs font-bold text-secondary tracking-widest uppercase" style="">起床时间</span>
<input class="w-full bg-transparent border-none p-0 text-xl font-bold text-primary focus:ring-0" type="time">
</div>
<div class="bg-surface-container-low p-4 rounded-xl space-y-2">
<span class="text-xs font-bold text-secondary tracking-widest uppercase" style="">睡觉时间</span>
<input class="w-full bg-transparent border-none p-0 text-xl font-bold text-primary focus:ring-0" type="time">
</div>
</div>
</div>
<!-- Question 5: Morning State -->
<div class="space-y-4">
<label class="text-lg font-headline font-bold text-primary block" style="">5. 您起床时感觉精神状态如何？</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-4 text-sm focus:ring-2 focus:ring-secondary/20 placeholder:text-outline" placeholder="请描述您清晨的感受，例如：清醒、疲倦或头痛..." rows="3"></textarea>
</div>
<!-- Question 6: Screen Time -->
<div class="space-y-4">
<label class="text-lg font-headline font-bold text-primary block" style="">6. 您每天花多少时间：</label>
<div class="bg-surface-container-low rounded-xl divide-y-2 divide-surface">
<div class="p-4 flex items-center justify-between">
<div class="flex items-center">
<span class="material-symbols-outlined text-secondary mr-3" style="">tv</span>
<span class="font-medium" style="">看电视</span>
</div>
<input class="w-24 bg-surface-container-highest border-none rounded-lg p-2 text-right text-sm focus:ring-secondary" placeholder="小时/分" type="text">
</div>
<div class="p-4 flex items-center justify-between">
<div class="flex items-center">
<span class="material-symbols-outlined text-secondary mr-3" style="">menu_book</span>
<span class="font-medium" style="">阅读</span>
</div>
<input class="w-24 bg-surface-container-highest border-none rounded-lg p-2 text-right text-sm focus:ring-secondary" placeholder="小时/分" type="text">
</div>
<div class="p-4 flex items-center justify-between">
<div class="flex items-center">
<span class="material-symbols-outlined text-secondary mr-3" style="">devices</span>
<span class="font-medium" style="">使用电子屏幕</span>
</div>
<input class="w-24 bg-surface-container-highest border-none rounded-lg p-2 text-right text-sm focus:ring-secondary" placeholder="小时/分" type="text">
</div>
</div>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-24 bg-white/80 backdrop-blur-xl flex justify-between items-center px-8 pb-safe z-50 rounded-t-3xl shadow-[0_-8px_24px_rgba(0,30,64,0.06)]">
<!-- Progress Dots (10 total) -->
<div class="flex gap-2 items-center">
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-3 h-3 rounded-full bg-blue-900 ring-4 ring-blue-100"></div> <!-- Active Dot 6 -->
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
<div class="w-2 h-2 rounded-full bg-blue-200"></div>
</div>
<!-- Next Action -->
<button class="bg-blue-900 text-white rounded-full p-4 hover:scale-110 transition-transform active:scale-90 duration-200 flex items-center justify-center" style="">
<span class="material-symbols-outlined" style="">arrow_forward</span>
</button>
</nav>
</body></html>
