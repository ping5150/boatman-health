<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>账户 - 船夫健康</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Work_Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#b4c8e2",
                        "secondary-fixed-dim": "#a4c9ff",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001b3c",
                        "secondary-container": "#70aeff",
                        "inverse-on-surface": "#eff1f4",
                        "tertiary-container": "#21354a",
                        "on-error": "#ffffff",
                        "tertiary": "#0a2033",
                        "surface-container-high": "#e6e8eb",
                        "primary-fixed-dim": "#a7c8ff",
                        "surface-container-highest": "#e0e3e6",
                        "surface": "#f7f9fc",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "on-primary-container": "#799dd6",
                        "secondary": "#075fab",
                        "outline-variant": "#c3c6d1",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container": "#eceef1",
                        "outline": "#737780",
                        "on-secondary-fixed": "#001c39",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1e",
                        "primary": "#001e40",
                        "on-tertiary-fixed": "#071d30",
                        "tertiary-fixed": "#d0e4ff",
                        "background": "#f7f9fc",
                        "surface-tint": "#3a5f94",
                        "on-primary-fixed-variant": "#1f477b",
                        "surface-dim": "#d8dadd",
                        "on-secondary-container": "#004077",
                        "on-tertiary-fixed-variant": "#35485e",
                        "on-surface-variant": "#43474f",
                        "on-tertiary-container": "#8a9eb6",
                        "surface-container-low": "#f2f4f7",
                        "primary-container": "#003366",
                        "primary-fixed": "#d5e3ff",
                        "surface-variant": "#e0e3e6",
                        "inverse-primary": "#a7c8ff",
                        "secondary-fixed": "#d4e3ff",
                        "surface-bright": "#f7f9fc",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#004884"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Work Sans"],
                        "label": ["Work Sans"]
                    },
                    borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Work Sans', sans-serif; background-color: #f7f9fc; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#f7f9fc]/80 backdrop-blur-xl shadow-sm">
<div class="flex justify-between items-center px-6 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#001e40] cursor-pointer hover:opacity-80 transition-opacity active:scale-95 duration-200">menu</span>
</div>
<h1 class="font-headline font-black text-2xl tracking-widest text-[#001e40]">船夫健康</h1>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#001e40] cursor-pointer hover:opacity-80 transition-opacity active:scale-95 duration-200">account_circle</span>
</div>
</div>
<div class="bg-[#f2f4f7] h-[1px] opacity-10"></div>
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto space-y-8">
<!-- User Profile Hero Section -->
<section class="relative group">
<div class="p-8 rounded-[2rem] bg-gradient-to-br from-primary to-primary-container text-white overflow-hidden shadow-[0_20px_40px_rgba(0,30,64,0.15)]">
<!-- Decorative element -->
<div class="absolute -right-10 -top-10 w-40 h-40 bg-secondary/10 rounded-full blur-3xl"></div>
<div class="flex items-center space-x-6 relative z-10">
<div class="w-20 h-20 rounded-full bg-surface/10 backdrop-blur-md flex items-center justify-center border border-white/10">
<span class="material-symbols-outlined text-4xl text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<div>
<h2 class="font-headline font-extrabold text-3xl tracking-tight">王德华</h2>
</div>
</div>
</div>
</section>
<!-- Personal Information Section -->
<section class="space-y-4">
<h3 class="font-headline font-bold text-lg text-primary px-2">档案中心</h3>
<div class="grid grid-cols-1 gap-4">
<!-- Basic Info -->
<div class="p-6 rounded-[1.5rem] bg-surface-container-low flex justify-between items-center group transition-all duration-300 hover:bg-surface-container">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-primary/5 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary">badge</span>
</div>
<div>
<p class="font-headline font-bold text-primary">基本信息</p>
<p class="text-xs text-on-surface-variant">个人身份及联系方式</p>
</div>
</div>
<button class="px-4 py-2 text-xs font-bold text-secondary bg-secondary/5 rounded-full hover:bg-secondary/10 transition-colors">查看/修改</button>
</div>
<!-- Deep Health Profile -->
<div class="p-6 rounded-[1.5rem] bg-surface-container-low flex justify-between items-center group transition-all duration-300 hover:bg-surface-container">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-primary/5 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary">analytics</span>
</div>
<div>
<p class="font-headline font-bold text-primary">深度健康档案</p>
<p class="text-xs text-on-surface-variant">病历、体检报告及用药史</p>
</div>
</div>
<button class="px-4 py-2 text-xs font-bold text-secondary bg-secondary/5 rounded-full hover:bg-secondary/10 transition-colors">查看/修改</button>
</div>
</div>
</section>
<!-- My Appointments Section -->
<section class="space-y-4">
<h3 class="font-headline font-bold text-lg text-primary px-2">调研问卷</h3>
<div class="grid grid-cols-1 gap-4">
<!-- Sleep Survey -->
<div class="p-6 rounded-[1.5rem] bg-surface-container-low flex justify-between items-center group transition-all duration-300 hover:bg-surface-container">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-primary/5 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary">bedtime</span>
</div>
<div>
<p class="font-headline font-bold text-primary">睡眠调研问卷</p>
<p class="text-xs text-on-surface-variant">了解您的日常睡眠质量</p>
</div>
</div>
<button class="px-4 py-2 text-xs font-bold text-secondary bg-secondary/5 rounded-full hover:bg-secondary/10 transition-colors">查看/修改</button>
</div>
<!-- Nutrition Survey -->
<div class="p-6 rounded-[1.5rem] bg-surface-container-low flex justify-between items-center group transition-all duration-300 hover:bg-surface-container">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-primary/5 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary">nutrition</span>
</div>
<div>
<p class="font-headline font-bold text-primary">营养调研问卷</p>
<p class="text-xs text-on-surface-variant">评估您的饮食与营养摄入</p>
</div>
</div>
<button class="px-4 py-2 text-xs font-bold text-secondary bg-secondary/5 rounded-full hover:bg-secondary/10 transition-colors">查看/修改</button>
</div>
</div>
</section>
<!-- System Settings Section -->
<section class="pt-4">
<div class="bg-surface-container-low rounded-[2rem] overflow-hidden">
<div class="p-2 space-y-1">
<div class="flex justify-between items-center p-4 hover:bg-surface-container transition-colors rounded-2xl cursor-pointer">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">support_agent</span>
<span class="font-medium text-sm">联系管家</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</div>
<div class="flex justify-between items-center p-4 hover:bg-error/5 transition-colors rounded-2xl cursor-pointer">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-error">logout</span>
<span class="font-medium text-sm text-error">退出登录</span>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-[#f7f9fc]/80 backdrop-blur-xl border-t border-[#001e40]/5 shadow-[0_-8px_24px_rgba(0,30,64,0.06)] rounded-t-[2rem]">
<div class="flex justify-around items-center px-4 pb-6 pt-3">
<div class="flex flex-col items-center justify-center text-[#001e40]/40 hover:text-[#075fab] transition-colors px-4 py-1 active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Work_Sans'] text-[10px] font-semibold uppercase tracking-wider mt-1">首页</span>
</div>
<div class="flex flex-col items-center justify-center text-[#001e40]/40 hover:text-[#075fab] transition-colors px-4 py-1 active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="medical_services">medical_services</span>
<span class="font-['Work_Sans'] text-[10px] font-semibold uppercase tracking-wider mt-1">服务</span>
</div>
<div class="flex flex-col items-center justify-center text-[#075fab] bg-[#003366]/5 rounded-xl px-4 py-1 active:scale-90 duration-200 cursor-pointer">
<span class="material-symbols-outlined" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Work_Sans'] text-[10px] font-semibold uppercase tracking-wider mt-1">账户</span>
</div>
</div>
</nav>
</body></html>
