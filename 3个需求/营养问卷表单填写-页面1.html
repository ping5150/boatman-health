        theme: {
          extend: {

                    "surface-container-lowest": "#ffffff",
                    "surface": "#f7f9fc",
                    "background": "#f7f9fc",
                    "secondary": "#075fab",
                    "on-surface-variant": "#43474f",
                    "on-tertiary-fixed-variant": "#35485e",
                    "on-primary": "#ffffff",
                    "tertiary": "#0a2033",
                    "surface-variant": "#e0e3e6",
                    "surface-container-high": "#e6e8eb",
                    "primary-container": "#003366",
                    "on-tertiary-container": "#8a9eb6",
                    "on-error": "#ffffff",
                    "surface-container": "#eceef1",
                    "primary": "#001e40",
                    "on-primary-container": "#799dd6",
                    "on-tertiary-fixed": "#071d30",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#a7c8ff",
                    "tertiary-fixed": "#d0e4ff",
                    "tertiary-container": "#21354a",
                    "surface-container-highest": "#e0e3e6",
                    "inverse-surface": "#2d3133",
                    "inverse-on-surface": "#eff1f4",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "on-secondary-fixed-variant": "#004884",
                    "surface-container-low": "#f2f4f7",
                    "secondary-container": "#70aeff",
                    "on-background": "#191c1e",
                    "outline-variant": "#c3c6d1",
                    "on-primary-fixed": "#001b3c",
                    "surface-tint": "#3a5f94",
                    "outline": "#737780",
                    "on-secondary-container": "#004077",
                    "on-primary-fixed-variant": "#1f477b",
                    "secondary-fixed": "#d4e3ff",
                    "on-secondary-fixed": "#001c39",
                    "primary-fixed-dim": "#a7c8ff",
                    "secondary-fixed-dim": "#a4c9ff",
                    "primary-fixed": "#d5e3ff",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d8dadd",
                    "tertiary-fixed-dim": "#b4c8e2",
                    "on-surface": "#191c1e",
                    "surface-bright": "#f7f9fc",
                    "on-error-container": "#93000a"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Work Sans"],
                    "label": ["Work Sans"]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow { box-shadow: 0 4px 16px rgba(0, 30, 64, 0.04); }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen pb-44">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl flex items-center justify-between px-6 py-3">
<div class="flex items-center gap-3">
<button class="text-primary active:scale-95 transition-transform" style="">
<span class="material-symbols-outlined" data-icon="arrow_back" style="">arrow_back</span>
</button>
<span class="text-base font-extrabold text-primary tracking-widest font-headline" style="">船夫健康</span>
</div>
<!-- Progress Bar (10%) -->
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-surface-container-high">
<div class="h-full bg-secondary w-[10%] transition-all duration-500"></div>
</div>
</header>
<main class="max-w-screen-md mx-auto pt-14 px-6">
<!-- Hero Section -->
<section class="mb-5">
<span class="text-secondary font-headline font-bold tracking-tight text-xs block mb-0.5 uppercase" style=""><br></span>
<h1 class="font-headline font-extrabold text-2xl text-primary leading-tight tracking-tight" style="">01 健康信息</h1>
<p class="text-on-surface-variant mt-1 text-xs max-w-prose opacity-80" style="">为了提供精准的私人管家式营养服务，请详细填写您的基础现状与核心诉求。</p>
</section>
<form class="space-y-5">
<!-- Question 1 -->
<div class="space-y-2">
<label class="block" style="">
<span class="text-primary font-bold text-base mb-1.5 block leading-snug" style="">您此次咨询的主要原因或关注点是什么？</span>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-3 focus:ring-2 focus:ring-secondary/20 text-on-surface text-sm placeholder:text-outline/40 transition-all editorial-shadow" placeholder="例如：近期感到疲劳、希望通过饮食改善血糖等..." rows="2"></textarea>
</label>
</div>
<!-- Question 2 -->
<div class="space-y-2">
<label class="block" style="">
<span class="text-primary font-bold text-base mb-1.5 block leading-snug" style="">您希望营养师在哪些具体目标或领域上为您提供支持？</span>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-3 focus:ring-2 focus:ring-secondary/20 text-on-surface text-sm placeholder:text-outline/40 transition-all editorial-shadow" placeholder="例如：减脂增肌方案、慢病调理、每日配餐建议等..." rows="2"></textarea>
</label>
</div>
<!-- Health Information -->
<section class="space-y-3">
<div class="flex items-center gap-2">
<span class="w-5 h-[2px] bg-secondary"></span>
<h2 class="font-headline font-bold text-base text-primary tracking-tight" style="">基础体征</h2>
</div>
<div class="grid grid-cols-2 gap-3">
<!-- Height -->
<div class="bg-surface-container-low p-3 rounded-xl editorial-shadow transition-all flex flex-col justify-center">
<span class="text-on-surface-variant font-semibold text-[10px] uppercase tracking-widest block mb-1 opacity-60" style="">身高</span>
<div class="flex items-baseline gap-1">
<input class="bg-transparent border-none p-0 text-xl font-headline font-bold text-primary w-14 focus:ring-0 placeholder:text-outline-variant" placeholder="000" type="number">
<span class="text-on-surface-variant font-bold text-[10px]" style="">厘米</span>
</div>
</div>
<!-- Weight -->
<div class="bg-surface-container-low p-3 rounded-xl editorial-shadow transition-all flex flex-col justify-center">
<span class="text-on-surface-variant font-semibold text-[10px] uppercase tracking-widest block mb-1 opacity-60" style="">体重</span>
<div class="flex items-baseline gap-1">
<input class="bg-transparent border-none p-0 text-xl font-headline font-bold text-primary w-14 focus:ring-0 placeholder:text-outline-variant" placeholder="00.0" type="number">
<span class="text-on-surface-variant font-bold text-[10px]" style="">千克</span>
</div>
</div>
</div>
</section>
<!-- Question 3 -->
<div class="space-y-2">
<h3 class="text-primary font-bold text-base leading-snug" style="">在过去一个月内，您的体重有明显变化吗？</h3>
<div class="grid grid-cols-3 gap-2">
<label class="relative flex items-center justify-center p-2.5 rounded-xl bg-surface-container-low cursor-pointer transition-all active:scale-95 editorial-shadow group" style="">
<input class="sr-only peer" name="weight_change" type="radio">
<div class="absolute inset-0 rounded-xl peer-checked:ring-2 peer-checked:ring-secondary peer-checked:bg-secondary/5 transition-all"></div>
<span class="relative font-bold text-primary text-xs transition-colors" style="">是</span>
</label>
<label class="relative flex items-center justify-center p-2.5 rounded-xl bg-surface-container-low cursor-pointer transition-all active:scale-95 editorial-shadow group" style="">
<input class="sr-only peer" name="weight_change" type="radio">
<div class="absolute inset-0 rounded-xl peer-checked:ring-2 peer-checked:ring-secondary peer-checked:bg-secondary/5 transition-all"></div>
<span class="relative font-bold text-primary text-xs transition-colors" style="">否</span>
</label>
<label class="relative flex items-center justify-center p-2.5 rounded-xl bg-surface-container-low cursor-pointer transition-all active:scale-95 editorial-shadow group" style="">
<input class="sr-only peer" name="weight_change" type="radio">
<div class="absolute inset-0 rounded-xl peer-checked:ring-2 peer-checked:ring-secondary peer-checked:bg-secondary/5 transition-all"></div>
<span class="relative font-bold text-primary text-xs transition-colors" style="">其他</span>
</label>
</div>
</div>
<!-- Question 4: Chronic Conditions -->
<div class="space-y-2">
<label class="block" style="">
<span class="text-primary font-bold text-base mb-1.5 block leading-snug" style="">您是否有任何慢性疾病或健康问题？如果有，请说明。</span>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-3 focus:ring-2 focus:ring-secondary/20 text-on-surface text-sm placeholder:text-outline/40 transition-all editorial-shadow" placeholder="请详细描述病情或目前的健康状况..." rows="2"></textarea>
</label>
</div>
<!-- Question 5: Medications -->
<div class="space-y-2">
<label class="block" style="">
<span class="text-primary font-bold text-base mb-1.5 block leading-snug" style="">您目前是否正在服用任何药物、补充剂或草药？如果是，请说明药物或补充剂名字、服用频率、是否是医生推荐或者其他专业人士推荐</span>
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-3 focus:ring-2 focus:ring-secondary/20 text-on-surface text-sm placeholder:text-outline/40 transition-all editorial-shadow" placeholder="请列出名称、剂量、频率及来源..." rows="3"></textarea>
</label>
</div>
</form>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-slate-50/90 backdrop-blur-2xl rounded-t-[24px] shadow-[0_-4px_16px_rgba(0,30,64,0.04)] px-6 py-5 flex flex-col items-center max-w-screen-xl mx-auto left-1/2 -translate-x-1/2">
<div class="w-full flex flex-col items-center gap-3">
<!-- Progress Indicators -->
<div class="flex items-center gap-2">
<div class="flex items-center gap-1">
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_6px_rgba(0,30,64,0.2)]"></div>
<div class="w-1 h-1 rounded-full bg-primary/20"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
<div class="w-1 h-1 rounded-full bg-primary/10"></div>
</div>
<span class="ml-1.5 font-body text-[10px] font-semibold uppercase tracking-widest text-primary/60" style="">进度 01/10</span>
</div>
<!-- Action Button -->
<button class="w-full flex items-center justify-center bg-primary text-white rounded-full px-8 py-3.5 shadow-md hover:brightness-110 active:scale-95 transition-all gap-2 group" style="">
<span class="font-body text-xs font-semibold uppercase tracking-widest" style="">下一模块：饮食习惯</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" data-icon="arrow_forward" style="">arrow_forward</span>
</button>
</div>
</nav>

</body></html>
