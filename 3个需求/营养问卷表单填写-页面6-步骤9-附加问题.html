<script>
    // Simple script to handle toggling selected state (visual only)
    document.querySelectorAll('.grid button').forEach(btn => {
        btn.addEventListener('click', function() {
            const row = this.parentElement;
            row.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-primary-container', 'shadow-md', 'scale-105');
                b.querySelector('span').classList.remove('text-white', 'font-bold');
                b.querySelector('span').classList.add('text-outline');
            });
            this.classList.add('bg-primary-container', 'shadow-md', 'scale-105');
            this.querySelector('span').classList.remove('text-outline');
            this.querySelector('span').classList.add('text-white', 'font-bold');
        });
    });
</script>
