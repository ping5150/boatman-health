server {
    server_name ws.ziya.site;

    # 1-4. /daily-remind → 代理到 daily-remind 站点（透传参数）
    location /daily-remind/ {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://687kj2w8jm.coze.site/;
        proxy_ssl_server_name on;
        proxy_set_header Host 687kj2w8jm.coze.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer https://687kj2w8jm.coze.site;
        proxy_hide_header Content-Security-Policy;
        
        # 重写 HTML 中的资源路径
        sub_filter 'src="/assets/' 'src="/daily-remind/assets/';
        sub_filter 'href="/assets/' 'href="/daily-remind/assets/';
        sub_filter 'src="/scripts/' 'src="/daily-remind/scripts/';
        sub_filter 'href="/scripts/' 'href="/daily-remind/scripts/';
        sub_filter_types text/html application/javascript text/css;
        sub_filter_once off;
    }

    # 5-6. /bse → 代理到 BSE 站点
    location /bse/ {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://pwv4g2rvxx.coze.site/;
        proxy_ssl_server_name on;
        proxy_set_header Host pwv4g2rvxx.coze.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer https://pwv4g2rvxx.coze.site;
        proxy_hide_header Content-Security-Policy;
        
        # 重写 HTML 中的资源路径：将 /assets/ 替换为 /bse/assets/
        sub_filter 'src="/assets/' 'src="/bse/assets/';
        sub_filter 'href="/assets/' 'href="/bse/assets/';
        sub_filter_types text/html application/javascript text/css;
        sub_filter_once off;
    }

    # 默认：代理到 daily-remind 站点
    location / {
        resolver 8.8.8.8 valid=30s;
        proxy_pass https://687kj2w8jm.coze.site;
        proxy_ssl_server_name on;
        proxy_set_header Host 687kj2w8jm.coze.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer https://687kj2w8jm.coze.site;
        proxy_hide_header Content-Security-Policy;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ws.ziya.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.ziya.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
}

server {
    listen 80;
    server_name ws.ziya.site;
    return 301 https://$host$request_uri;
}
