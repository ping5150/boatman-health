# ==================== 测试环境 Nginx 配置 ====================
# 文件位置：/etc/nginx/conf.d/boatman-health-test.conf

# 测试环境前端（端口 3002）
server {
    listen 3002;
    server_name _;

    # 访问日志
    access_log /www/logs/boatman-health/nginx-test-access.log;
    error_log /www/logs/boatman-health/nginx-test-error.log;

    # 用户端前端
    location / {
        root /www/server/boatman-health-test/client;
        try_files $uri $uri/ /index.html;
        index index.html;

        # 禁用缓存（测试环境）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理后台前端
    location /admin {
        alias /www/server/boatman-health-test/admin;
        try_files $uri $uri/ /admin/index.html;
        index index.html;

        # 禁用缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理后台静态资源
    location /admin/assets {
        alias /www/server/boatman-health-test/admin/assets;
        expires 1d;
    }

    # API 代理 - 认证
    location /api/auth {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API 代理 - 表单
    location /api/form1 {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
